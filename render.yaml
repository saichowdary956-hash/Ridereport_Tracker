
services:
  - type: web
    name: ride-report-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ride-report-db
          property: connectionString
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: ride-report-db
    plan: basic-256mb
    databaseName: ride_reports
    user: ride_reports_user
